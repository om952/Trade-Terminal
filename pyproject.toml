[project]
name = "trade-terminal"
version = "0.5.0"
description = "Automated trading terminal: visual strategies, backtest, paper, live."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.0",
    "duckdb>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "websockets>=15.0",
    "protobuf>=6.0",
    "anthropic>=2.8.0",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/live/proto/*_pb2.py"]

[tool.ruff.lint]
# Correctness rules only. Style rewrites across a tested trading engine are
# risk without benefit; widen this deliberately, one rule family at a time.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
    "B905",  # zip(strict=): the engine zips equal-length series by construction
    "E741",  # `l` for "low" is conventional in OHLC code
]

[tool.ruff.lint.per-file-ignores]
# conftest must set environment variables before importing the backend.
"backend/tests/*.py" = ["E402", "F841", "B007"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
exclude = ["backend/live/proto/", "backend/tests/"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = false
warn_unused_ignores = true
