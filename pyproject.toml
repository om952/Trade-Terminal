[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-terminal"
dynamic = ["version"]
description = "Automated trading terminal: visual strategies, backtest, paper, live."
readme = "README.md"
requires-python = ">=3.12"
# Floors are what the code needs; ceilings stop a new major (which these
# libraries ship with breaking changes) arriving unannounced. Exact versions
# live in uv.lock.
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.0,<2",
    "duckdb>=1.5,<3",
    "pytz",  # duckdb needs it to return TIMESTAMPTZ values as Python datetimes
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    "pyarrow>=20.0",
    "websockets>=15.0",
    "protobuf>=6.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=1.18",
    "pip-audit>=2.9",
]

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.setuptools.package-data]
"backend.live.proto" = ["*.proto"]
"backend.app" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/live/proto/*_pb2.py"]  # generated by protoc

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.pycodestyle]
# New code targets 100 columns; existing dense numeric lines run to ~112 and
# are clearer unwrapped, so lint only fails past this.
max-line-length = 115

[tool.ruff.lint.per-file-ignores]
# Tests silence third-party deprecation warnings before importing them.
"backend/tests/*" = ["E402"]

[tool.mypy]
# Lenient on purpose: catch real type errors in annotated code without
# demanding annotations everywhere on day one. Tighten module by module.
python_version = "3.12"
packages = ["backend"]
exclude = ["backend/tests/", "backend/live/proto/"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true

# Baseline: modules with type errors when mypy was introduced (2026-10-25).
# Everything else, and every new module, is checked. Remove a module from this
# list once it passes; never add one.
[[tool.mypy.overrides]]
module = [
    "backend.data.ingest",
    "backend.data.instruments",
    "backend.indicators.base",
    "backend.indicators.trend",
    "backend.indicators.volume",
    "backend.live.session",
    "backend.strategy.indicator_set",
    "backend.strategy.option_book",
]
ignore_errors = true
