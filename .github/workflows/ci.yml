name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python 3.14

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Tests
        run: uv run --frozen pytest -q

      - name: Tests left the repo's data folder untouched
        run: |
          if [ -n "$(find data -type f 2>/dev/null)" ]; then
            echo "The test suite wrote into data/:"; find data -type f; exit 1
          fi

      - name: Dependency audit
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project -o requirements.audit.txt
          uv run --frozen pip-audit -r requirements.audit.txt --no-deps --disable-pip

      # Informational until the existing type errors are cleared; see
      # PRODUCTION_PLAN.md P0.5. Remove continue-on-error once it passes.
      - name: Type check (informational)
        continue-on-error: true
        run: uv run --frozen mypy

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Component tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    # The real UI, API, graph and engine; only the model is scripted.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Happy path
        run: npx playwright test
        working-directory: frontend
      # The same test against the packaged app: build the wheel, install it
      # outside the checkout, and let it serve its own UI.
      - name: Build and install the wheel
        run: |
          (cd frontend && npm run build)
          uv build --wheel --out-dir /tmp/wheel
          uv venv --python 3.14 /tmp/inst
          uv pip install --python /tmp/inst/bin/python /tmp/wheel/*.whl
      - name: Happy path on the installed build
        working-directory: frontend
        env:
          TRADE_TERMINAL_HOME: /tmp/tt-home
          LLM_PROVIDER: scripted
          LLM_SCRIPT: ${{ github.workspace }}/frontend/e2e/script.json
          E2E_BASE_URL: http://127.0.0.1:8771
        run: |
          (cd / && /tmp/inst/bin/trade-terminal doctor)
          (cd / && /tmp/inst/bin/trade-terminal serve --port 8771 --no-browser &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8771/api/health && break; sleep 0.5; done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
